# ---------------------------------------------------------------------------
# Framework configuration
#
# Resolution order (highest priority first):
#   1. JVM system property        -> mvn test -Dbase.uri=https://...
#   2. Environment variable       -> BASE_URI=https://...   (dots become underscores, upper-cased)
#   3. Environment-scoped key     -> <env>.base.uri in this file
#   4. Global key                 -> base.uri in this file
#
# Select an environment with -Dtest.env=<name> (defaults to "prod").
# NEVER commit the API token. Provide it via -Dapi.token=... or the
# GOREST_TOKEN environment variable / GitHub Actions secret.
# ---------------------------------------------------------------------------

test.env=prod

# ---- Environment: prod (public GoRest instance) ----
prod.base.uri=https://gorest.co.in
prod.base.path=/public/v2

# ---- Environment: staging (example of routing to a second environment) ----
# GoRest exposes a single public host, so staging mirrors prod here.
# In a real project point this at your staging gateway.
staging.base.uri=https://gorest.co.in
staging.base.path=/public/v2

# ---- Global HTTP settings ----
http.connect.timeout.ms=10000
http.socket.timeout.ms=20000

# Console logging of each request/response line (Allure always gets full details)
log.console.enabled=true

# Prefix used when generating unique test-data emails
testdata.email.domain=sdet-framework.test
